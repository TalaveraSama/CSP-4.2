# CSP/OSCam panel behind aaPanel's nginx, served at the root of a (sub)domain.
#
# Paste the location blocks into: Website -> <your site> -> Config file,
# inside the existing `server { ... }` that aaPanel generated (keep its SSL and
# log directives). Then reload nginx from the aaPanel UI.

    # The panel is a SPA + JSON API, no websockets needed, but the Upgrade
    # headers are harmless and keep future features working.
    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Required: the panel marks its session cookie Secure based on this.
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_buffering    off;   # status polling feels snappier without buffering
    }

    # Static assets are content-hashed by vite: cache them hard.
    location ^~ /assets/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_set_header   Host $host;
        expires            30d;
        add_header         Cache-Control "public, immutable";
    }

    # Optional: restrict the panel to your own networks.
    # location / {
    #     allow 192.168.1.0/24;
    #     allow 203.0.113.7;
    #     deny  all;
    #     ...proxy_pass as above...
    # }
