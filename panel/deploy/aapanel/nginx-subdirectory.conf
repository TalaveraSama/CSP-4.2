# CSP/OSCam panel served from a sub-directory, e.g. https://midominio.com/csp/
#
# IMPORTANT: build the frontend with the same prefix, otherwise the browser will
# ask for /assets/... instead of /csp/assets/... :
#
#     cd /www/wwwroot/csp-panel/panel
#     BASE_PATH=/csp/ npm run build
#     pm2 restart csp-panel
#
# The trailing slash in `proxy_pass http://127.0.0.1:8090/;` is what strips the
# /csp prefix before the request reaches the Node app.

    location ^~ /csp/ {
        proxy_pass         http://127.0.0.1:8090/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /csp;

        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    # Redirect /csp -> /csp/ so relative asset urls resolve correctly.
    location = /csp {
        return 301 $scheme://$host/csp/;
    }
